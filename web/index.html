<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b10">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <title>NESkwik</title>
  <style>
    :root { color-scheme: dark; background: #090b10; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090b10; }
    body { font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
    #canvas { display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: .75rem; text-align: center; background: #090b10; color: #d8dee9; z-index: 10; }
    #loading[hidden] { display: none; }
    #status { color: #f19a9a; max-width: min(32rem, 90vw); }
  </style>
</head>
<body>
  <div id="loading"><strong>Loading NESkwik…</strong><span id="status"></span></div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <input id="rom-picker" type="file" accept=".nes,application/octet-stream" hidden>
  <input id="shader-picker" type="file" webkitdirectory multiple hidden>
  <script src="neskwik.js"></script>
</body>
</html>

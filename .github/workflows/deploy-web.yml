name: Deploy Web

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  EMSCRIPTEN_VERSION: 6.0.10
  CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'neskwik' }}

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          emsdk/emsdk activate "$EMSCRIPTEN_VERSION"

      - name: Build WASM app
        run: |
          source emsdk/emsdk_env.sh
          zig build --release=fast -Dtarget=wasm32-emscripten

      # The app uses pthreads, which need SharedArrayBuffer, which browsers only
      # enable on cross-origin isolated pages.
      - name: Add Cloudflare Pages headers
        run: |
          cat > zig-out/web/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          command: pages deploy zig-out/web --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.event.workflow_run.head_branch || github.ref_name }} --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
